<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark light" />
<title>Docket - Ask your documents</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
  :root{
    --bg:#0b0c0e;
    --bg-elevated:#101215;
    --bg-elevated-2:#181b1f;
    --border:#24272c;
    --border-soft:#1a1d21;
    --text:#edeef0;
    --text-muted:#9a9ea6;
    --text-faint:#787d85;
    --accent:#f5a524;
    --accent-strong:#ffbb4d;
    --accent-soft:#2a2210;
    --accent-ink:#1a1300;
    --danger:#f2555a;
    --danger-soft:#2a1516;
    --success:#3ddc97;
    --success-soft:#0f231b;
    --shadow: 0 20px 60px -20px rgba(0,0,0,.55);
    --radius-sm:8px;
    --radius-md:14px;
    --radius-lg:20px;
    --font-display:"Sora", ui-sans-serif, system-ui, sans-serif;
    --font-body:"Manrope", ui-sans-serif, system-ui, sans-serif;
    --font-mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#faf9f6;
      --bg-elevated:#ffffff;
      --bg-elevated-2:#f2f0ea;
      --border:#e6e2d9;
      --border-soft:#eeece5;
      --text:#1c1b18;
      --text-muted:#6b675f;
      --text-faint:#847f74;
      --accent:#a15a06;
      --accent-strong:#8a4c05;
      --accent-soft:#fbead0;
      --accent-ink:#1a1300;
      --danger:#c8323a;
      --danger-soft:#fbe6e6;
      --success:#177a54;
      --success-soft:#e4f5ee;
      --shadow: 0 20px 50px -24px rgba(28,27,24,.18);
    }
  }
  :root[data-theme="light"]{
    --bg:#faf9f6;
    --bg-elevated:#ffffff;
    --bg-elevated-2:#f2f0ea;
    --border:#e6e2d9;
    --border-soft:#eeece5;
    --text:#1c1b18;
    --text-muted:#6b675f;
    --text-faint:#847f74;
    --accent:#a15a06;
    --accent-strong:#8a4c05;
    --accent-soft:#fbead0;
    --accent-ink:#1a1300;
    --danger:#c8323a;
    --danger-soft:#fbe6e6;
    --success:#177a54;
    --success-soft:#e4f5ee;
    --shadow: 0 20px 50px -24px rgba(28,27,24,.18);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;min-height:100dvh;background:var(--bg);color:var(--text);
    font-family:var(--font-body);-webkit-font-smoothing:antialiased;
    transition:background-color .25s ease, color .25s ease;
  }
  a{color:inherit;}
  .app{max-width:1180px;margin:0 auto;padding:22px 24px 60px;}

  header.top{
    display:flex;align-items:center;justify-content:space-between;
    padding-bottom:18px;margin-bottom:28px;border-bottom:1px solid var(--border-soft);
    gap:12px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:19px;font-weight:600;letter-spacing:-.01em;}
  .brand-mark{flex-shrink:0;}
  .top-right{display:flex;align-items:center;gap:8px;}

  .icon-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:36px;height:36px;border-radius:var(--radius-sm);
    border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-muted);
    cursor:pointer;font-size:16px;transition:transform .15s ease, color .15s ease, border-color .15s ease, background-color .15s ease;
  }
  .icon-btn:hover{color:var(--text);border-color:var(--text-faint);}
  .icon-btn:active{transform:scale(.94);}

  .btn{
    cursor:pointer;border:none;border-radius:999px;padding:11px 18px;
    font-size:14px;font-weight:600;font-family:var(--font-body);
    transition:transform .15s ease, background-color .15s ease, color .15s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent);color:var(--accent-ink);width:100%;}
  .btn-primary:hover{background:var(--accent-strong);}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  .btn-ghost{
    display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--text-muted);
    border:1px solid var(--border);padding:8px 14px;
  }
  .btn-ghost:hover{color:var(--text);border-color:var(--text-faint);}
  .btn-link{background:none;color:var(--accent);text-decoration:none;padding:0;font-weight:600;}
  .btn-link:hover{color:var(--accent-strong);text-decoration:underline;}

  .hidden{display:none !important;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

  /* ---- Auth ---- */
  .auth-wrap{position:relative;min-height:64dvh;display:flex;align-items:center;justify-content:center;}
  .auth-wrap::before{
    content:"";position:absolute;top:-40px;left:50%;transform:translateX(-50%);
    width:520px;height:280px;border-radius:50%;
    background:radial-gradient(closest-side, var(--accent-soft), transparent 72%);
    opacity:.6;pointer-events:none;filter:blur(6px);
  }
  .auth-card{
    position:relative;width:100%;max-width:400px;background:var(--bg-elevated);
    border:1px solid var(--border);border-radius:var(--radius-lg);padding:34px;
    box-shadow:var(--shadow);
    animation:fadeUp .4s cubic-bezier(.16,1,.3,1);
  }
  .auth-card h1{font-family:var(--font-display);font-size:22px;margin:0 0 6px;font-weight:600;}
  .auth-card p.sub{color:var(--text-muted);font-size:14px;line-height:1.5;margin:0 0 24px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:7px;}
  .input-wrap{position:relative;}
  .input-wrap i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-faint);font-size:16px;pointer-events:none;}
  .input-wrap input{
    width:100%;padding:11px 12px 11px 38px;border:1px solid var(--border);border-radius:var(--radius-sm);
    font-size:14px;font-family:var(--font-body);background:var(--bg-elevated-2);color:var(--text);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .input-wrap input::placeholder{color:var(--text-faint);}
  .input-wrap input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .error-msg{
    display:flex;align-items:center;gap:8px;color:var(--danger);background:var(--danger-soft);
    border:1px solid var(--danger);border-radius:var(--radius-sm);padding:10px 12px;
    font-size:13px;margin-bottom:16px;
  }
  .toggle-row{text-align:center;margin-top:18px;font-size:13px;color:var(--text-muted);}

  /* ---- Layout ---- */
  .layout{display:grid;grid-template-columns:320px 1fr;gap:22px;align-items:start;}
  @media (max-width:860px){.layout{grid-template-columns:1fr;}}

  .panel{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-md);padding:20px;}
  .panel h2{font-family:var(--font-display);font-size:15px;margin:0 0 14px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .count-badge{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);background:var(--bg-elevated-2);padding:1px 7px;border-radius:999px;}
  .count-badge:empty{display:none;}

  .drop{
    position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
    border:1.5px dashed var(--border);border-radius:var(--radius-md);padding:22px 16px;
    color:var(--text-muted);cursor:pointer;transition:border-color .15s ease, background-color .15s ease, color .15s ease;
  }
  .drop:hover{border-color:var(--text-faint);}
  .drop.hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong);}
  .drop input{display:none;}
  .drop-icon{font-size:24px;color:var(--text-faint);}
  .drop.hover .drop-icon{color:var(--accent);}
  .drop strong{color:var(--text);font-weight:600;}
  .drop.hover strong{color:inherit;}
  .drop-sub{display:block;font-size:11px;color:var(--text-faint);margin-top:2px;}

  .doc-list{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:380px;overflow-y:auto;}
  .doc-list::-webkit-scrollbar{width:8px;}
  .doc-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

  .doc-item{
    display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:var(--radius-sm);
    cursor:pointer;border:1px solid transparent;transition:background-color .15s ease, border-color .15s ease;
  }
  .doc-item:hover{background:var(--bg-elevated-2);}
  .doc-item.active{background:var(--accent-soft);border-color:var(--accent);}
  .doc-icon{flex-shrink:0;font-size:17px;color:var(--text-faint);}
  .doc-item.active .doc-icon{color:var(--accent);}
  .doc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .doc-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;font-weight:500;}
  .doc-status{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;width:fit-content;}
  .doc-status.ready{color:var(--success);}
  .doc-status.processing{color:var(--accent);}
  .doc-status.queued{color:var(--text-faint);}
  .doc-status.failed{color:var(--danger);}
  .doc-del{
    flex-shrink:0;background:none;border:none;color:var(--text-faint);cursor:pointer;
    font-size:15px;padding:6px;border-radius:7px;opacity:.55;transition:opacity .15s ease, color .15s ease, background-color .15s ease;
  }
  .doc-item:hover .doc-del, .doc-del:focus-visible{opacity:1;}
  .doc-del:hover{color:var(--danger);background:var(--danger-soft);}

  .empty{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--text-faint);font-size:13px;padding:26px 8px;text-align:center;}
  .empty i{font-size:26px;}

  .doc-skeleton{display:flex;align-items:center;gap:10px;padding:10px;}
  .sk{background:linear-gradient(90deg,var(--bg-elevated-2) 25%,var(--border) 37%,var(--bg-elevated-2) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:6px;}
  .sk-icon{width:18px;height:18px;border-radius:5px;flex-shrink:0;}
  .sk-line{height:11px;flex:1;}

  .chat-panel{display:flex;flex-direction:column;height:70dvh;min-height:460px;}
  .chat-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;}
  .chat-header .doc-tag{
    display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:12px;
    color:var(--accent);background:var(--accent-soft);padding:5px 11px;border-radius:999px;
    max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  .messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:4px 4px 8px;}
  .messages::-webkit-scrollbar{width:8px;}
  .messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

  .msg-row{display:flex;align-items:flex-end;gap:8px;max-width:86%;animation:slideFadeIn .28s cubic-bezier(.16,1,.3,1);}
  .msg-row.user{align-self:flex-end;flex-direction:row-reverse;}
  .msg-row.assistant{align-self:flex-start;}
  .avatar{
    flex-shrink:0;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:13px;
  }
  .avatar.user{background:var(--bg-elevated-2);color:var(--text-muted);}
  .avatar.assistant{background:var(--accent-soft);color:var(--accent);}
  .msg{padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word;}
  .msg-row.user .msg{background:var(--text);color:var(--bg);border-bottom-right-radius:4px;}
  :root[data-theme="light"] .msg-row.user .msg{background:var(--accent-ink);color:#fff;}
  .msg-row.assistant .msg{background:var(--bg-elevated-2);color:var(--text);border-bottom-left-radius:4px;}
  .msg.pending{opacity:.85;}
  .msg.error{background:var(--danger-soft);color:var(--danger);}

  .thinking{display:inline-flex;gap:4px;align-items:center;height:14px;}
  .thinking span{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.3;animation:thinkPulse 1.1s ease-in-out infinite;}
  .thinking span:nth-child(2){animation-delay:.15s;}
  .thinking span:nth-child(3){animation-delay:.3s;}

  .composer{display:flex;gap:8px;margin-top:12px;align-items:center;}
  .composer input{
    flex:1;padding:12px 16px;border:1px solid var(--border);border-radius:999px;font-size:14px;
    font-family:var(--font-body);background:var(--bg-elevated-2);color:var(--text);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .composer input::placeholder{color:var(--text-faint);}
  .composer input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .composer input:disabled{opacity:.6;}
  .composer button{
    flex-shrink:0;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:var(--accent);color:var(--accent-ink);border:none;font-size:17px;cursor:pointer;
    transition:transform .15s ease, background-color .15s ease, opacity .15s ease;
  }
  .composer button:hover:not(:disabled){background:var(--accent-strong);}
  .composer button:active:not(:disabled){transform:scale(.93);}
  .composer button:disabled{opacity:.4;cursor:not-allowed;}

  .empty-chat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-faint);font-size:14px;text-align:center;padding:20px;}
  .empty-chat i{font-size:30px;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:9px;background:var(--bg-elevated);color:var(--text);
    border:1px solid var(--border);padding:11px 16px;border-radius:var(--radius-sm);
    font-size:13px;z-index:50;box-shadow:var(--shadow);
    animation:fadeUp .22s cubic-bezier(.16,1,.3,1);
  }
  .toast i{font-size:16px;}
  .toast.success{border-color:var(--success);color:var(--success);}
  .toast.error{border-color:var(--danger);color:var(--danger);}
  .toast.info i{color:var(--accent);}

  @keyframes fadeUp{from{opacity:0;transform:translate(-50%,8px);}to{opacity:1;transform:translate(-50%,0);}}
  @keyframes slideFadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @keyframes thinkPulse{0%,80%,100%{opacity:.25;transform:scale(.8);}40%{opacity:1;transform:scale(1);}}
  @keyframes shimmer{0%{background-position:100% 0;}100%{background-position:0 0;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  .spin{display:inline-block;animation:spin 1s linear infinite;}

  @media (prefers-reduced-motion: reduce){
    .auth-card, .msg-row, .toast{animation:none;}
    .thinking span{animation:none;opacity:.6;}
    .sk{animation:none;opacity:.6;}
    .spin{animation:none;}
    .btn, .icon-btn, .composer button{transition:none;}
  }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand">
      <svg class="brand-mark" width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M6 2h9l5 5v15a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z" fill="var(--accent)"/>
        <path d="M15 2v5h5" fill="none" stroke="var(--bg-elevated)" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M8 14h10M8 18h7" stroke="var(--bg-elevated)" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      Docket
    </div>
    <div class="top-right">
      <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle color theme">
        <i class="ph ph-moon" id="themeIcon"></i>
      </button>
      <button id="logoutBtn" class="btn btn-ghost hidden" type="button">
        <i class="ph ph-sign-out"></i> Sign out
      </button>
    </div>
  </header>

  <!-- AUTH VIEW -->
  <div id="authView" class="auth-wrap">
    <div class="auth-card">
      <h1 id="authTitle">Sign in</h1>
      <p class="sub" id="authSub">Ask questions, get answers grounded in your own PDFs.</p>
      <div id="authError" class="error-msg hidden"><i class="ph ph-warning-circle"></i><span id="authErrorText"></span></div>
      <div class="field" id="emailField">
        <label for="emailInput">Email</label>
        <div class="input-wrap">
          <i class="ph ph-envelope-simple"></i>
          <input id="emailInput" type="email" autocomplete="email" placeholder="you@example.com" />
        </div>
      </div>
      <div class="field">
        <label for="passwordInput">Password</label>
        <div class="input-wrap">
          <i class="ph ph-lock-simple"></i>
          <input id="passwordInput" type="password" autocomplete="current-password" placeholder="••••••••" />
        </div>
      </div>
      <button class="btn btn-primary" id="authSubmit" type="button">Sign in</button>
      <div class="toggle-row">
        <span id="toggleText">New here?</span>
        <button class="btn-link" id="toggleAuth" type="button">Create an account</button>
      </div>
    </div>
  </div>

  <!-- APP VIEW -->
  <div id="mainView" class="layout hidden">
    <div class="panel">
      <h2>Documents <span class="count-badge" id="docCount"></span></h2>
      <label class="drop" id="dropZone">
        <i class="ph ph-cloud-arrow-up drop-icon"></i>
        <div id="dropLabel"><strong>Drop a PDF here</strong> or click to upload<span class="drop-sub">PDF up to 25MB</span></div>
        <input id="fileInput" type="file" accept="application/pdf" />
      </label>
      <ul class="doc-list" id="docList"><li class="empty"><i class="ph ph-tray"></i>No documents yet.</li></ul>
    </div>

    <div class="panel chat-panel">
      <div class="chat-header">
        <h2 style="margin:0;">Ask</h2>
        <span class="doc-tag hidden" id="activeDocTag"><i class="ph ph-file-pdf"></i><span id="activeDocName"></span></span>
      </div>
      <div class="messages" id="messages">
        <div class="empty-chat" id="emptyChat"><i class="ph ph-chats-circle"></i>Select a document on the left, then ask it something.</div>
      </div>
      <div class="composer">
        <input id="questionInput" type="text" placeholder="Ask a question about the selected document…" disabled />
        <button id="askBtn" type="button" disabled aria-label="Send question"><i class="ph ph-paper-plane-right"></i></button>
      </div>
    </div>
  </div>

</div>

<div id="toastRegion" aria-live="polite"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const API_BASE = 'http://localhost:8000';
  const state = {
    apiBase: API_BASE,
    access: null, refresh: null,
    mode: 'login',
    documents: [],
    activeDocId: null,
    chatId: null,
  };

  // ---- Theme ----
  function applyTheme(theme){
    if (theme) document.documentElement.setAttribute('data-theme', theme);
    else document.documentElement.removeAttribute('data-theme');
    const isLight = theme === 'light' || (!theme && window.matchMedia('(prefers-color-scheme: light)').matches);
    $('themeIcon').className = 'ph ' + (isLight ? 'ph-moon' : 'ph-sun');
  }
  function currentTheme(){
    const stored = localStorage.getItem('docket_theme');
    if (stored) return stored;
    return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  applyTheme(localStorage.getItem('docket_theme'));
  $('themeToggle').addEventListener('click', () => {
    const next = currentTheme() === 'light' ? 'dark' : 'light';
    localStorage.setItem('docket_theme', next);
    applyTheme(next);
  });

  // ---- Toast ----
  const toastIcons = { success:'ph-check-circle', error:'ph-x-circle', info:'ph-info' };
  function toast(msg, type='info'){
    const region = $('toastRegion');
    region.innerHTML = '';
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.innerHTML = '<i class="ph ' + toastIcons[type] + '"></i><span></span>';
    el.querySelector('span').textContent = msg;
    region.appendChild(el);
    clearTimeout(region._h);
    region._h = setTimeout(() => { el.remove(); }, 3400);
  }

  function describeError(j) {
    if (!j) return null;
    if (Array.isArray(j.errors) && j.errors.length) {
      const parts = j.errors.map((e) => {
        const field = Array.isArray(e.loc) ? e.loc.filter((p) => p !== 'body').join('.') : '';
        return field ? field + ': ' + e.msg : e.msg;
      });
      return (j.detail ? j.detail + ': ' : '') + parts.join('; ');
    }
    return j.detail || null;
  }

  async function api(path, opts = {}, auth = true) {
    const headers = Object.assign({'Content-Type':'application/json'}, opts.headers || {});
    if (auth && state.access) headers['Authorization'] = 'Bearer ' + state.access;
    const res = await fetch(state.apiBase + path, Object.assign({}, opts, { headers }));
    if (res.status === 401 && auth && state.refresh) {
      const refreshed = await tryRefresh();
      if (refreshed) return api(path, opts, auth);
    }
    if (!res.ok) {
      let detail = res.statusText;
      try { const j = await res.json(); detail = describeError(j) || detail; } catch(e){}
      throw new Error(detail);
    }
    if (res.status === 204) return null;
    return res.json();
  }

  async function tryRefresh(){
    try {
      const data = await api('/auth/refresh', {method:'POST', body: JSON.stringify({refresh_token: state.refresh})}, false);
      state.access = data.access_token; state.refresh = data.refresh_token;
      persistTokens();
      return true;
    } catch(e){ signOut(); return false; }
  }

  function persistTokens(){
    localStorage.setItem('docket_access', state.access || '');
    localStorage.setItem('docket_refresh', state.refresh || '');
  }

  // ---- Auth ----
  function setMode(mode){
    state.mode = mode;
    $('authTitle').textContent = mode === 'login' ? 'Sign in' : 'Create an account';
    $('authSubmit').textContent = mode === 'login' ? 'Sign in' : 'Create account';
    $('toggleText').textContent = mode === 'login' ? 'New here?' : 'Already have an account?';
    $('toggleAuth').textContent = mode === 'login' ? 'Create an account' : 'Sign in';
    $('authError').classList.add('hidden');
  }
  $('toggleAuth').addEventListener('click', () => setMode(state.mode === 'login' ? 'register' : 'login'));

  $('authSubmit').addEventListener('click', async () => {
    const email = $('emailInput').value.trim();
    const password = $('passwordInput').value;
    $('authError').classList.add('hidden');
    if (!email || !password) { showAuthError('Enter an email and password.'); return; }
    const btn = $('authSubmit');
    btn.disabled = true;
    try {
      if (state.mode === 'register') {
        await api('/auth/register', {method:'POST', body: JSON.stringify({email, password})}, false);
      }
      const data = await api('/auth/login', {method:'POST', body: JSON.stringify({email, password})}, false);
      state.access = data.access_token; state.refresh = data.refresh_token;
      persistTokens();
      await enterApp();
    } catch(e){ showAuthError(e.message); }
    finally { btn.disabled = false; }
  });

  function showAuthError(msg){ $('authErrorText').textContent = msg; $('authError').classList.remove('hidden'); }

  $('logoutBtn').addEventListener('click', signOut);
  function signOut(){
    state.access = null; state.refresh = null; state.documents = []; state.activeDocId = null;
    localStorage.removeItem('docket_access'); localStorage.removeItem('docket_refresh');
    $('mainView').classList.add('hidden');
    $('authView').classList.remove('hidden');
    $('logoutBtn').classList.add('hidden');
  }

  async function enterApp(){
    $('authView').classList.add('hidden');
    $('mainView').classList.remove('hidden');
    $('logoutBtn').classList.remove('hidden');
    await loadDocuments();
  }

  // ---- Documents ----
  function renderDocSkeleton(){
    $('docList').innerHTML = Array.from({length:3}).map(() =>
      '<li class="doc-skeleton"><span class="sk sk-icon"></span><span class="sk sk-line"></span></li>'
    ).join('');
  }

  async function loadDocuments(){
    renderDocSkeleton();
    try {
      const data = await api('/documents?page=1&page_size=100');
      state.documents = data.items || [];
      renderDocs();
      state.documents.forEach(doc => {
        if (doc.status === 'uploaded' || doc.status === 'processing') pollDocument(doc.id);
      });
    } catch(e){
      toast('Could not load documents: ' + e.message, 'error');
      state.documents = [];
      renderDocs();
    }
  }

  // Upload/processing runs in the background on the server; poll until the
  // document leaves the uploaded/processing states instead of assuming it's
  // done when the upload request returns.
  const activePolls = new Set();
  function pollDocument(docId){
    if (activePolls.has(docId)) return;
    activePolls.add(docId);
    const tick = async () => {
      let doc;
      try {
        doc = await api(`/documents/${docId}`);
      } catch(e){
        activePolls.delete(docId);
        return;
      }
      const idx = state.documents.findIndex(d => d.id === docId);
      if (idx !== -1) { state.documents[idx] = doc; renderDocs(); }
      if (doc.status === 'uploaded' || doc.status === 'processing') {
        setTimeout(tick, 2500);
      } else {
        activePolls.delete(docId);
        const name = doc.filename || doc.name || 'Document';
        if (doc.status === 'ready') toast(name + ' is ready', 'success');
        else if (doc.status === 'failed') toast(name + ' failed to process', 'error');
      }
    };
    setTimeout(tick, 2500);
  }

  function statusMeta(status){
    switch(status){
      case 'ready': return {icon:'ph-check-circle', label:'Ready', cls:'ready'};
      case 'processing': return {icon:'ph-circle-notch spin', label:'Processing', cls:'processing'};
      case 'uploaded': return {icon:'ph-clock', label:'Queued', cls:'queued'};
      case 'failed': return {icon:'ph-warning-circle', label:'Failed', cls:'failed'};
      default: return {icon:'ph-file', label: status || 'Unknown', cls:''};
    }
  }

  function renderDocs(){
    const list = $('docList');
    $('docCount').textContent = state.documents.length ? String(state.documents.length) : '';
    if (!state.documents.length) {
      list.innerHTML = '<li class="empty"><i class="ph ph-tray"></i>No documents yet.</li>';
      return;
    }
    list.innerHTML = '';
    state.documents.forEach(doc => {
      const name = doc.filename || doc.name || 'document';
      const meta = statusMeta(doc.status);
      const li = document.createElement('li');
      li.className = 'doc-item' + (doc.id === state.activeDocId ? ' active' : '');
      li.innerHTML = `
        <i class="ph ph-file-pdf doc-icon"></i>
        <div class="doc-main">
          <span class="doc-name" title="${escapeHtml(name)}">${escapeHtml(name)}</span>
          <span class="doc-status ${meta.cls}"><i class="ph ${meta.icon}"></i>${escapeHtml(meta.label)}</span>
        </div>
        <button class="doc-del" title="Delete" aria-label="Delete ${escapeHtml(name)}"><i class="ph ph-trash"></i></button>`;
      li.addEventListener('click', (e) => {
        if (e.target.closest('.doc-del')) return;
        selectDoc(doc);
      });
      li.querySelector('.doc-del').addEventListener('click', async (e) => {
        e.stopPropagation();
        if (!confirm('Delete this document?')) return;
        try {
          await api(`/documents/${doc.id}`, {method:'DELETE'});
          state.documents = state.documents.filter(d=>d.id!==doc.id);
          if(state.activeDocId===doc.id){state.activeDocId=null; state.chatId=null; resetChat();}
          renderDocs();
          toast('Document deleted', 'success');
        } catch(err){ toast('Delete failed: '+err.message, 'error'); }
      });
      list.appendChild(li);
    });
  }

  function selectDoc(doc){
    state.activeDocId = doc.id;
    state.chatId = null;
    $('activeDocName').textContent = doc.filename || doc.name || 'document';
    $('activeDocTag').classList.remove('hidden');
    $('questionInput').disabled = false;
    $('askBtn').disabled = false;
    resetChat();
    renderDocs();
  }

  function resetChat(){
    if (state.activeDocId) {
      $('messages').innerHTML = '';
    } else {
      $('messages').innerHTML = '<div class="empty-chat" id="emptyChat"><i class="ph ph-chats-circle"></i>Select a document on the left, then ask it something.</div>';
    }
  }

  // Upload
  const dropZone = $('dropZone'), fileInput = $('fileInput');
  const dropLabelDefault = '<strong>Drop a PDF here</strong> or click to upload<span class="drop-sub">PDF up to 25MB</span>';
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('hover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('hover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('hover');
    if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', e => { if (e.target.files.length) uploadFile(e.target.files[0]); });

  async function uploadFile(file){
    if (file.type !== 'application/pdf') { toast('Only PDF files are supported.', 'error'); return; }
    if (file.size > 25 * 1024 * 1024) { toast('File exceeds the 25MB limit.', 'error'); return; }
    $('dropLabel').innerHTML = 'Uploading <strong>' + escapeHtml(file.name) + '</strong>…';
    const form = new FormData();
    form.append('file', file);
    try {
      const headers = {};
      if (state.access) headers['Authorization'] = 'Bearer ' + state.access;
      const res = await fetch(state.apiBase + '/documents/upload', { method: 'POST', headers, body: form });
      if (!res.ok) { const j = await res.json().catch(()=>({})); throw new Error(describeError(j) || res.statusText); }
      const doc = await res.json();
      state.documents.unshift(doc);
      renderDocs();
      toast('Uploaded ' + file.name + ', processing…', 'info');
      pollDocument(doc.id);
    } catch(e){ toast('Upload failed: ' + e.message, 'error'); }
    finally { $('dropLabel').innerHTML = dropLabelDefault; fileInput.value=''; }
  }

  // ---- Chat ----
  function addMessage(role, text, pending=false){
    $('emptyChat')?.classList.add('hidden');
    const row = document.createElement('div');
    row.className = 'msg-row ' + role;
    const avatar = document.createElement('div');
    avatar.className = 'avatar ' + role;
    avatar.innerHTML = role === 'user' ? '<i class="ph ph-user"></i>' : '<i class="ph ph-sparkle"></i>';
    const bubble = document.createElement('div');
    bubble.className = 'msg ' + role + (pending ? ' pending' : '');
    if (pending) {
      bubble.innerHTML = '<span class="thinking" role="status" aria-label="' + escapeHtml(text) + '"><span></span><span></span><span></span></span>';
    } else {
      bubble.textContent = text;
    }
    row.appendChild(avatar); row.appendChild(bubble);
    $('messages').appendChild(row);
    $('messages').scrollTop = $('messages').scrollHeight;
    return bubble;
  }

  async function ask(){
    const input = $('questionInput');
    const question = input.value.trim();
    if (!question || !state.activeDocId) return;
    input.value = '';
    $('askBtn').disabled = true;
    addMessage('user', question);
    const pendingEl = addMessage('assistant', 'Thinking', true);
    try {
      const data = await api('/chat', {
        method: 'POST',
        body: JSON.stringify({ document_id: state.activeDocId, question, chat_id: state.chatId, stream: false })
      });
      state.chatId = data.chat_id || state.chatId;
      pendingEl.textContent = data.answer || data.message || JSON.stringify(data);
      pendingEl.classList.remove('pending');
    } catch(e){
      pendingEl.textContent = 'Error: ' + e.message;
      pendingEl.classList.remove('pending');
      pendingEl.classList.add('error');
    } finally {
      $('askBtn').disabled = false;
      $('messages').scrollTop = $('messages').scrollHeight;
    }
  }
  $('askBtn').addEventListener('click', ask);
  $('questionInput').addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---- Boot ----
  (async function boot(){
    const a = localStorage.getItem('docket_access');
    const r = localStorage.getItem('docket_refresh');
    if (a && r) {
      state.access = a; state.refresh = r;
      try { await api('/users/me'); await enterApp(); }
      catch(e){ signOut(); }
    }
  })();
})();
</script>
</body>
</html>
